<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heaven Coin - Press & Relax</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        .card { background: #111; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .btn-relax { background: #0088cc; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-size: 1.2rem; cursor: pointer; }
        .btn-relax:disabled { background: #444; }
        .monitor { display: flex; justify-content: space-around; font-size: 0.9rem; color: #aaa; }
        .ton-val { color: #00d1ff; }
    </style>
</head>
<body>
    <h1>Heaven Coin ☁️</h1>
    
    <div class="card">
        <h3>My Heaven Points</h3>
        <h2 id="points">0</h2>
        <p id="timer">Ready to Relax</p>
    </div>

    <button id="relaxBtn" class="btn-relax" onclick="mine()">Press & Relax</button>

    <div class="card monitor">
        <div>TON: <span class="ton-val" id="tonPrice">Loading...</span></div>
        <div>$HEAVEN: <span id="heavenVal">0.00 TON</span></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
