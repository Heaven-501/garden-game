<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heaven Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="monitor-panel">
            <div class="price-box">
                <span class="label">TON Price</span>
                <span class="value" id="ton-price">Loading...</span>
            </div>
            <div class="price-box">
                <span class="label">Heaven Value</span>
                <span class="value">0.05 TON</span>
            </div>
        </header>

        <main class="main-content">
            <div class="cloud-icon">☁️</div>
            <h1>Heaven Coin</h1>
            
            <div class="balance-card">
                <p class="balance-label">Your Balance</p>
                <h2 id="point-balance">0</h2>
                <p class="sub-balance" id="coin-balance">≈ 0 Big Coins</p>
            </div>

            <button id="mine-btn" class="relax-btn">
                Press & Relax
            </button>
            
            <p id="timer" class="timer-text">Ready to mine</p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
